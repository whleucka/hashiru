; Extensions Hashiru's own package list implies but Arch ships commented out.
;
; The php package installs /etc/php/php.ini with every extension= line disabled,
; so `php-sqlite` lands its .so and nothing loads it — pdo_sqlite is missing
; until someone uncomments a line. This drop-in enables them instead of editing
; php.ini, because php.ini belongs to pacman: an edit there is replaced by a
; .pacnew on the next php upgrade and quietly reverts. /etc/php/conf.d is
; scanned after php.ini, and extension lines are additive.
;
; curl and zip are here because composer is in the same package list and needs
; them. sqlite3/pdo_sqlite because php-sqlite is installed for them.

extension=curl
extension=zip
extension=sqlite3
extension=pdo_sqlite
