# Hashiru UPower policy
# Copy to /etc/UPower/UPower.conf.d/99-hashiru.conf

[UPower]
# Swap is zram-only, so the machine can't hibernate and Auto falls back to
# suspend at the action threshold -- which keeps draining the battery until it
# dies uncleanly. Power off instead.
CriticalPowerAction=PowerOff
