# Hashiru BlueZ input settings, merged into /etc/bluetooth/input.conf by stage
# 10. Same in-place merge as main.conf beside it.

[General]
# Accept HID connections from devices BlueZ holds no link key for. Xbox
# controllers often finish pairing without one, and with the default (true)
# their reconnect is refused as "!bonded": pair, power off, and the pad is
# dead until it is paired again.
ClassicBondedOnly = false
