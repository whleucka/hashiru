# Hashiru BlueZ settings, merged into /etc/bluetooth/main.conf by stage 10.
# BlueZ has no drop-in directory, so only these keys are set in place; the
# rest of the file is pacman's. A key here wins over the same key there.

[General]
# Let a device that lost its pairing key pair again without a confirm prompt.
# Xbox controllers forget their key easily, and without this they only come
# back by removing and re-pairing them by hand.
JustWorksRepairing = always
# Faster page scan, so a controller or headset reconnects within a second or
# two of being switched on. Costs a little idle power.
FastConnectable = true
