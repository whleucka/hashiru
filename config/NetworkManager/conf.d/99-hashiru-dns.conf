# Hand NetworkManager's DNS to openresolv instead of writing /etc/resolv.conf
# directly. With the default (rc-manager=symlink), NM never registers its
# servers with resolvconf, so when a VPN that does (wg-quick, openvpn) goes
# down, openresolv rebuilds resolv.conf from nothing and DNS is gone until the
# connection is bounced. Through resolvconf, the VPN's exclusive entry wins
# while it is up and NM's comes back the moment it is removed.
[main]
rc-manager=resolvconf
