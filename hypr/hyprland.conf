# Hashiru Hyprland Configuration (0.53.1+)
# https://wiki.hypr.land/

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(7aa2f7ee) rgba(9ece6aee) 45deg
    col.inactive_border = rgba(414868aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------

input {
    kb_layout = us
    kb_options = caps:escape

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
}

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

decoration {
    rounding = 4

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 4, ease, slide
    animation = windowsOut, 1, 4, ease, slide
    animation = border, 1, 5, default
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
}

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
}

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # 0.53+ replaces new_window_takes_over_fullscreen
    on_focus_under_fullscreen = 1
}

xwayland {
    force_zero_scaling = true
}
