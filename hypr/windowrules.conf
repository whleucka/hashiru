# Window Rules (Hyprland 0.53+ syntax)
# https://wiki.hypr.land/Configuring/Window-Rules/
#
# New syntax: windowrule = match:class <regex>, <rule>
# Or block syntax for multiple rules on same match

# -----------------------------------------------------------------------------
# Floating windows
# -----------------------------------------------------------------------------

windowrule = float, match:class ^(pavucontrol)$
windowrule = float, match:class ^(nm-connection-editor)$
windowrule = float, match:class ^(blueman-manager)$
windowrule = float, match:class ^(thunar)$, match:title ^(File Operation Progress)$
windowrule = float, match:class ^(org.gnome.Calculator)$
windowrule = float, match:class ^(imv)$
windowrule = float, match:title ^(Picture-in-Picture)$

# File dialogs
windowrule = float, match:title ^(Open File)$
windowrule = float, match:title ^(Save File)$
windowrule = float, match:title ^(Open Folder)$
windowrule = float, match:title ^(Save As)$

# Polkit
windowrule = float, match:class ^(polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------------------------------
# Opacity
# -----------------------------------------------------------------------------

windowrule {
    name = terminal-opacity
    match:class = ^(kitty)$
    opacity = 0.95 0.85
}

# -----------------------------------------------------------------------------
# Size and position
# -----------------------------------------------------------------------------

windowrule {
    name = pavucontrol-size
    match:class = ^(pavucontrol)$
    size = 800 600
    center = on
}

# -----------------------------------------------------------------------------
# Workspace assignments
# -----------------------------------------------------------------------------

# Browser to workspace 2
windowrule = workspace 2, match:class ^(chromium)$
windowrule = workspace 2, match:class ^(firefox)$

# File manager to workspace 3
windowrule = workspace 3, match:class ^(thunar)$

# Discord to workspace 9
windowrule = workspace 9, match:class ^(discord)$

# -----------------------------------------------------------------------------
# Idle inhibit (prevent screen lock)
# -----------------------------------------------------------------------------

windowrule = idleinhibit fullscreen, match:class ^(chromium)$
windowrule = idleinhibit fullscreen, match:class ^(firefox)$
windowrule = idleinhibit fullscreen, match:class ^(mpv)$

# -----------------------------------------------------------------------------
# XWayland
# -----------------------------------------------------------------------------

windowrule = noanim, match:xwayland 1
