# Window Rules
# https://wiki.hypr.land/Configuring/Window-Rules/

# -----------------------------------------------------------------------------
# Floating windows
# -----------------------------------------------------------------------------

windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, class:^(imv)$
windowrule = float, title:^(Picture-in-Picture)$

# File dialogs
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save File)$
windowrule = float, title:^(Save As)$
windowrule = float, title:^(Open Folder)$

# Polkit
windowrule = float, class:^(polkit-gnome-authentication-agent-1)$

# -----------------------------------------------------------------------------
# Opacity
# -----------------------------------------------------------------------------

windowrule = opacity 0.95 0.85, class:^(kitty)$

# -----------------------------------------------------------------------------
# Size and position
# -----------------------------------------------------------------------------

windowrule = size 800 600, class:^(pavucontrol)$
windowrule = center, class:^(pavucontrol)$

# -----------------------------------------------------------------------------
# Workspace assignments
# -----------------------------------------------------------------------------

windowrule = workspace 2, class:^(chromium)$
windowrule = workspace 2, class:^(firefox)$
windowrule = workspace 3, class:^(thunar)$
windowrule = workspace 9, class:^(discord)$

# -----------------------------------------------------------------------------
# Idle inhibit (prevent screen lock)
# -----------------------------------------------------------------------------

windowrule = idleinhibit fullscreen, class:^(chromium)$
windowrule = idleinhibit fullscreen, class:^(firefox)$
windowrule = idleinhibit fullscreen, class:^(mpv)$

# -----------------------------------------------------------------------------
# XWayland
# -----------------------------------------------------------------------------

windowrule = noanim, xwayland:1
