# Hyprpaper configuration (0.8.0+ syntax)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

# Preload wallpapers
preload = ~/.config/hypr/wallpaper.jpg

# Set wallpaper (monitor, path)
wallpaper = , ~/.config/hypr/wallpaper.jpg

# Disable IPC (saves resources if not needed)
ipc = off

# Disable splash
splash = false
