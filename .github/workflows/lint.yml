name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x --source-path=. \
            install.sh \
            doctor.sh \
            lib/common.sh \
            bin/hashiru \
            scripts/*.sh \
            iso/build.sh \
            iso/verify.sh \
            iso/test-qemu.sh \
            iso/firstboot/*.sh \
            iso/overlay/airootfs/root/stage0.sh \
            config/profile.d/hashiru-report.sh
