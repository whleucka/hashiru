# btop configuration
#
# Partial on purpose: btop merges this over its own defaults, so only what
# Hashiru actually decides belongs here. Everything else is upstream's call.

#* Tokyo Night. Resolved by name from /usr/share/btop/themes (btop ships it, and
#* btop is in pacman/base.txt), so there is nothing to vendor here — unlike bat,
#* kitty, and yazi, which each carry a tokyonight theme upstream doesn't provide.
color_theme = "tokyo-night"

#* Never write this file back. btop saves its full config on exit by default,
#* which through a stow symlink means every quit rewrites the file inside the
#* Hashiru checkout — and `hashiru update` refuses to run on a dirty tree.
#* Settings changed in btop's options menu now last for that session only.
save_config_on_exit = false
