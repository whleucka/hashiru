# Snappy Switcher — Hashiru's ALT+Tab / SUPER+Tab window switcher.
# https://github.com/OpalAayan/snappy-switcher
#
# Binds are in hypr/keybinds.lua, the daemon starts from hypr/autostart.lua, and
# hypr/layerrules.lua blurs behind the panel. After editing this file:
#
#   snappy-switcher --reload-config
#
# Every key here was checked against the v4.5.0 parser (src/config.c); an
# unknown key is silently ignored, so a typo just keeps the default.

[general]
# context groups tiled windows that share a workspace and app into one card
# with a count badge; floating windows are never grouped. overview = one each.
mode = context
follow_monitor = true
show_workspace_badge = true
# false: the first Tab already lands on the previous window, as ALT+Tab should.
sticky_mode = false
ignore_pinned = false
# The scratchpad (CTRL+`) is summoned, not switched to; keep it out.
ignore_special = true

[theme]
# The base file only fills in anything left out below. Its own accents are pink
# and red ("Neon District Remix"), so every colour is restated here in the
# palette the rest of the desktop uses: waybar, fuzzel, the groupbar.
name = tokyo-night.ini

# #RRGGBBAA. The panel background is translucent for the blur layer rule.
background                = #1a1b26e6
card_bg                   = #24283bff
card_selected             = #33467cff
text_color                = #c0caf5ff
subtext_color             = #a9b1d6ff
border_color              = #7aa2f7ff
bundle_bg                 = #24283bcc
badge_bg                  = #3d59a1ff
badge_text_color          = #c0caf5ff
badge_bg_selected         = #7aa2f7ff
badge_text_color_selected = #1a1b26ff

# Same 2px border and near-square corners as windows and fuzzel.
border_width      = 2
card_border_width = 2
corner_radius     = 2

[layout]
card_width  = 145
card_height = 135
card_gap    = 10
padding     = 10
max_cols    = 5
icon_size   = 57
icon_radius = 2

[icons]
# Papirus-Dark is the desktop's icon theme (fonts.txt, gtk-3.0, fuzzel).
theme                = Papirus-Dark
fallback             = hicolor
show_letter_fallback = true

[font]
family     = CaskaydiaMono Nerd Font
weight     = Bold
title_size = 10
