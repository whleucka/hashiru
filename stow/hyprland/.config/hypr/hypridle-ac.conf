# hypridle on AC. Same as hypridle-battery.conf, with a longer fuse: plugged in
# is where long reads and builds happen, and blanking at five minutes was why
# idle used to be switched off entirely on AC.
#
# To change the timeouts on one machine, copy this file to
# ~/.config/hashiru/hypr/hypridle-ac.conf and edit the copy: it replaces
# this one, and `~/.config/hypr/scripts/hypridle-battery reload` applies it.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 930
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
