background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3

    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false

    # Tokyo Night colors
    outer_color = rgb(65, 72, 104)        # subtle blue-gray border
    inner_color = rgb(26, 27, 38)         # tokyonight background
    font_color  = rgb(192, 202, 245)      # soft lavender text

    fade_on_empty = false
    placeholder_text = <i>󰈷   Authenticate</i>
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

# Empty unless fprintd finds a reader, so machines without one show nothing
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(169, 177, 214)            # tokyonight fg_dark
    font_size = 12

    position = 0, -70
    halign = center
    valign = center
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
}
