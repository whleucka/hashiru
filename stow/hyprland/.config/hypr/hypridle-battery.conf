# hypridle on battery. Started by scripts/hypridle-battery, which swaps this for
# hypridle-ac.conf when the charger goes in. The general block is identical in
# both: locking before sleep is not a power policy.
#
# To change the timeouts on one machine, copy this file to
# ~/.config/hashiru/hypr/hypridle-battery.conf and edit the copy: it replaces
# this one, and `~/.config/hypr/scripts/hypridle-battery reload` applies it.

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Lid close suspends via clamshell.lua; this is what makes the resume land
    # on a lock screen instead of the desktop.
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
