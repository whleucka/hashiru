# herdr configuration — stow-managed by hashiru (stow/herdr)
# Docs: https://herdr.dev/docs/config-reference/
# Print all defaults:  herdr --default-config
# Validate this file:  herdr config check
# Reload live server:  herdr server reload-config   (or prefix+shift+r)

# We've been through onboarding; don't show it again.
onboarding = false

[theme]
# Matches the kitty Tokyo Night theme in ~/.config/kitty.
name = "tokyo-night"

[terminal]
# Interactive panes use zsh (our login shell).
default_shell = "zsh"

[keys]
# Prefix: ctrl+a (screen-style). Tap it, release, then the action key.
prefix = "ctrl+a"

# --- Direct terminal-mode chords (no prefix) -------------------------------
# These are global within herdr (they win over the focused pane's program),
# so kitty must NOT eat them first — see the `map ... ` unbinds in
# ~/.config/kitty/kitty.conf.

# Tabs
new_tab = "ctrl+shift+t"        # new tab
rename_tab = "ctrl+shift+alt+t" # rename tab
close_tab = "ctrl+shift+q"      # close tab (default was prefix+shift+x)
previous_tab = "ctrl+shift+h"   # tab nav prev
next_tab = "ctrl+shift+l"       # tab nav next
switch_tab = "ctrl+1..9"        # jump straight to tab N

# Panes
close_pane = "ctrl+shift+x"     # close pane
split_horizontal = "ctrl+shift+s" # split (default was prefix+minus)
split_vertical = "ctrl+shift+d"   # vertical split (default was prefix+v)
zoom = "ctrl+shift+m"           # toggle pane zoom / fullscreen (default was prefix+z)
resize_mode = "ctrl+shift+r"    # enter resize mode, then hjkl to adjust divider (default was prefix+r)
edit_scrollback = "prefix+e"    # herdr's built-in plain-text scrollback dump (kept as a fallback;
                                # the colored pager on ctrl+shift+g below is the one to reach for)
# Pane focus is super+h/j/k/l via the Hyprland ctrl+alt+hjkl injection below.

# Session
detach = "prefix+shift+q"      # detach

# Workspaces
workspace_picker = "prefix+w"     # session/workspace navigator (herdr default;
                                  # ctrl+shift+w is free again since the browser
                                  # split was removed, but kitty still unbinds it)
close_workspace = "prefix+q"       # close workspace (default was prefix+shift+d)
new_workspace = "prefix+shift+n"   # herdr default (shift+n pairs with next_workspace on prefix+n)
rename_workspace = "prefix+shift+w"  # herdr default
previous_workspace = "ctrl+shift+k"  # ws nav prev (direct chord; p = previous)
next_workspace = "ctrl+shift+j"      # ws nav next (direct chord; n = next; was kitty new-os-window)
switch_workspace = "alt+1..9"   # jump to workspace N (no shift: ctrl+shift+digit = ctrl+symbol, doesn't match)
goto = "ctrl+backtick"         # quick jump (direct chord, ctrl+`)

# Worktrees — each git worktree opens as its own workspace, so two agents can
# work separate branches of one repo side by side. new_worktree keeps its
# herdr default (prefix+shift+g); open/remove are unbound by default. prefix+g
# is free because goto moved to ctrl+backtick.
open_worktree = "prefix+g"
remove_worktree = "prefix+ctrl+g"   # opens a confirmation first

# Pane/tab housekeeping
last_pane = "prefix+semicolon"       # back-and-forth between two panes (tmux prefix+;)
rename_pane = "prefix+shift+p"       # herdr default; named panes show in the sidebar
clear_pane = "prefix+ctrl+l"
move_tab_previous = "ctrl+shift+alt+h"  # reorder tabs; pairs with ctrl+shift+h/l tab nav
move_tab_next = "ctrl+shift+alt+l"

# Agents
previous_agent = "ctrl+shift+p"   # prev agent (up in the vertical agent list)
next_agent = "ctrl+shift+n"       # next agent (down in the list; pairs with h/l tab nav)
focus_agent = "ctrl+alt+1..9"          # jump straight to agent N (alt chords are terminal-dependent)

# Unified super+hjkl navigation (nvim splits -> herdr panes -> Hyprland windows).
# Hyprland's super+hjkl injects ctrl+alt+hjkl into this pty (see ~/.config/hypr/
# scripts/nav); the router decides forward-to-nvim vs move-pane vs escalate.
# In a (n)vim pane herdr-route forwards the chord and herdr-splits.nvim owns the
# whole walk (that plugin is personal config, so it lives in the dotfiles repo,
# not here — nav still works without it, just without the nvim-split layer).
# Rollback: point these four back at `herdr-nav key <h|j|k|l> <l|d|u|r>`, still
# alongside in scripts/.
[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route nav h left"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route nav j down"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route nav k up"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route nav l right"

# Yazi in a split, opened along the focused pane's longer axis so both halves
# stay usable. The built-in `type = "pane"` would also give a self-closing
# split, but it offers no say in the direction (`direction` is not a valid
# keys.command field — herdr logs "unknown config key ...; ignoring key"), so
# herdr-split-run measures the pane and calls `pane split` itself. It runs the
# command with `exec`, so quitting yazi (q) still disposes of the pane.
# ctrl+shift+y is not a kitty default, so no kitty unbind is needed.
[[keys.command]]
key = "ctrl+shift+y"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-split-run -- yazi"
description = "open yazi split"

# Colored scrollback pager — takes over ctrl+shift+g from the built-in
# edit_scrollback (now on prefix+e), which dumps the pane as plain text with
# every escape sequence stripped, so diffs, test output, and agent UIs land
# colorless. This captures `herdr pane read --format ansi` instead and reads it
# in neovim, where ftplugin/ansi.lua turns the SGR codes into real highlights
# (baleia.nvim). A popup keeps the tab layout untouched; `q` closes.
# --from-popup tells the script to ignore the popup's own terminal when it works
# out which pane you were reading.
[[keys.command]]
key = "ctrl+shift+g"
type = "popup"
command = "$HOME/.config/herdr/scripts/scrollback --from-popup"
width = "95%"
height = "95%"

# lazydocker in a popup — containers, logs and stats over the current layout,
# gone again on `q`. prefix+d is free (close_workspace moved to prefix+q).
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"
description = "lazydocker"

# mantis-tui (MantisBT issues) and fnav (fleet navigator) in popups, same shape
# as lazydocker. Both live outside PATH as the herdr server sees it — the server
# is a lazy daemon started under Hyprland, and these bin dirs are only added by
# ~/.zshrc.local — so the command goes through an interactive zsh to pick that
# PATH up, and `exec` hands the popup straight to the TUI. prefix+m and prefix+f
# are unbound in herdr's defaults.
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "zsh -ic 'exec mantis-tui'"
width = "90%"
height = "90%"
description = "mantis-tui"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "zsh -ic 'exec fnav'"
width = "90%"
height = "90%"
description = "fnav"

# Move the focused pane forward/backward through the tab's pane order (tmux
# swap-pane -D/-U). herdr's native swap is directional only; herdr-swap walks
# the linear pane list. (ctrl+shift+b reclaimed from open_notification_target.)
[[keys.command]]
key = "ctrl+shift+f"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-swap f"

[[keys.command]]
key = "ctrl+shift+b"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-swap b"

# Cycle the focused tab through layout presets — tmux's next-layout
# (prefix+space): columns -> rows -> main-vertical -> main-horizontal -> grid,
# and back. Presets that look identical at the current pane count are skipped,
# so a two-pane tab just toggles side-by-side <-> stacked (what the old
# ctrl+shift+o flip did) while three or more panes get the arrangement you
# actually wanted. Pass a preset name to herdr-relayout to jump straight to it.
#
# herdr has no native re-layout: the socket API's layout.apply CAN set an
# arbitrary tree but respawns every pane in the tab (it ignores each node's
# pane_id), so it kills running processes. herdr-relayout instead bounces panes
# through scratch tabs with `pane move`, which re-parents the real pty.
# Replaces herdr-flip, which could only flip the one split above the focused
# pane and gave up when that pane's sibling was itself a split. Direct chord, so
# kitty must not eat it first — see the `map ctrl+shift+o` unbind in
# ~/.config/kitty/kitty.conf.
[[keys.command]]
key = "ctrl+shift+o"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-relayout next"
description = "cycle tab layout"

# Resize the focused pane's split (no resize_mode): alt+h/j/k/l move the divider
# left/down/up/right by 5%. Direct chords, so they win over the pane program's
# own alt+hjkl (e.g. zsh word bindings) while herdr is focused — which is why
# these go through herdr-route rather than calling `pane resize` directly: in a
# (n)vim pane the chord has to reach neovim, or a nvim-side split-resize plugin
# could never see it (herdr would swallow every alt+hjkl first). herdr-route
# forwards to nvim when the pane runs vim and resizes the divider otherwise.
# (herdr-route also fixes the PATH: the server is a lazy daemon started by the
# first client under Hyprland and inherits a PATH without ~/.local/bin, so a
# bare `herdr` in a keybind is "command not found" and silently no-ops.)
[[keys.command]]
key = "alt+h"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route resize h left"

[[keys.command]]
key = "alt+j"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route resize j down"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route resize k up"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-route resize l right"

[ui]
# Draw borders + gaps around split panes so focus is obvious.
pane_borders = true
pane_gaps = true

# Zoom marker. herdr always appends a dim "Z" to the zoomed pane's tab label,
# which is easy to miss on a wide tab row — this adds herdr's built-in `zoom`
# status entry, a bold accent-highlighted ZOOM badge at the right edge of the
# tab bar. It only renders while a pane is zoomed, and it updates instantly
# (unlike a `command` entry, which is polled on an interval of >= 1s).
tab_bar_right = [{ type = "zoom" }]

status_indicators = "symbols"

# Agent panel as an attention queue: blocked agents float to the top instead of
# sitting under their workspace.
agent_panel_sort = "priority"

# Label split borders with the detected agent ("claude") when a pane has no
# manual name, so a tab with several agents stays readable.
show_agent_labels_on_pane_borders = true

# No tab row for a workspace with a single tab.
hide_tab_bar_when_single_tab = true

# Space rows: workspace name, then its git branch and dirty state.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# Agent rows: for Claude, show what it is doing (its terminal title) rather
# than just the agent name.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
# Route agent state-change notifications to the OS service (mako).
# Set to "off" if these get noisy, "herdr" for in-app toasts only.
delivery = "system"

[ui.sound]
# Audible ping when a background agent changes state.
# Custom mp3s (relative to this config's dir). Swap the two to taste.
enabled = true
request_path = "mgs.mp3"   # agent needs attention (MGS "!" alert)
done_path = "ding.mp3"     # agent finished

[session]
# Restore AI-agent panes into their sessions after a server restart.
resume_agents_on_restore = true

[experimental]
# Pass kitty graphics protocol escapes through to the host terminal (images
# in panes: image.nvim, chafa, timg, etc.).
kitty_graphics = true

# Save recent pane screen contents across full server restarts, so a reboot
# brings back what each pane last showed, not an empty shell.
pane_history = true
