# ── Kitty Terminal Config ────────────────────────────────────────────────────
include tokyonight.conf
active_border_color #a6e3a1
window_border_width 1.4pt
confirm_os_window_close 0

# Custom shaders
custom_shaders cursor-trail-blaze

# Font settings
font_family      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Regular
bold_font        family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBold
italic_font      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Italic
bold_italic_font family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBoldItalic
font_size        12

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000
scrollbar        scrolled-or-hovered

# Jump between shell prompts (needs shell_integration). kitty_mod+x is
# close_window here, which shadows the default next-prompt key, so both
# directions live on the arrows instead. That trades away keyboard line
# scrolling; the wheel and kitty_mod+page_up/page_down still scroll.
map kitty_mod+up        scroll_to_prompt -1
map kitty_mod+down      scroll_to_prompt 1

# Yank the last command's output to the clipboard.
map kitty_mod+y         copy_last_command_output

# Pager: neovim instead of less. nvim_open_term renders kitty's ANSI colours
# into a terminal buffer with no process behind it, so it is read-only, opens
# at the bottom, and q closes it. Recipe from kitty's own docs; needs nvim
# 0.12+. Used by show_scrollback and search_scrollback (kitty_mod+/, which
# types the selection into nvim's /).
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# Whole scrollback on kitty_mod+g. The default show_scrollback key, kitty_mod+h,
# is previous_tab here; g's default (last command output) is covered by
# kitty_mod+y.
map kitty_mod+g         show_scrollback

# Window settings
window_padding_width 0
window_margin_width 0
background_opacity 0.825

# Tab bar (sleek, minimal, glowing active tab)
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style fade
tab_fade 0.25 0.5 0.75 1

# Background of the bar itself
tab_bar_background #1a1b26

# Active tab
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
active_tab_font_style   bold

# Inactive tabs
inactive_tab_background #1a1b26
inactive_tab_foreground #c0caf5

# Optional: subtle separator highlight
tab_separator_color #414868

# Copy/paste
clipboard_control write-clipboard write-primary
copy_on_select        clipboard
strip_trailing_spaces smart
paste_actions         quote-urls-at-prompt

# Mouse
mouse_hide_wait 3.0
mouse_map middle release ungrabbed paste_from_selection

# Keyboard shortcuts
map kitty_mod+f5        reload_config_file
map kitty_mod+f2        edit_config_file

# Tabs and splits — kitty is the multiplexer. Chords kept from the herdr days,
# so muscle memory carries over. kitty_mod is ctrl+shift.
# NOTE: kitty has no inline comments on map lines -- keep these bare.
#
# Layouts: splits for arbitrary hsplit/vsplit trees, stack for "maximize".
# Only these two, so nothing cycles you into tall/fat/grid by accident.
enabled_layouts splits,stack

# Tabs: new (in this cwd), rename, close, prev/next, jump to N.
map kitty_mod+t         new_tab_with_cwd
map kitty_mod+alt+t     set_tab_title
map kitty_mod+q         close_tab
map kitty_mod+h         previous_tab
map kitty_mod+l         next_tab
map ctrl+1              goto_tab 1
map ctrl+2              goto_tab 2
map ctrl+3              goto_tab 3
map ctrl+4              goto_tab 4
map ctrl+5              goto_tab 5
map ctrl+6              goto_tab 6
map ctrl+7              goto_tab 7
map ctrl+8              goto_tab 8
map ctrl+9              goto_tab 9

# Splits: s stacks the new pane below (horizontal divider), d puts it beside
# (vertical divider). Both open in the current pane's cwd. h/l are tab nav and
# v is paste, so neither is free.
map kitty_mod+s         launch --location=hsplit --cwd=current
map kitty_mod+d         launch --location=vsplit --cwd=current
map kitty_mod+x         close_window

# Maximize: flip this tab to the stack layout and back. The tab title gets a
# [Z] while it is maximized (tab_title_template below).
map kitty_mod+m         toggle_layout stack

# Cycle panes forward/backward. Directional moves are super+hjkl, shared with
# neovim and Hyprland (hypr/scripts/nav), and so is resizing on super+ctrl+hjkl.
# kitty's defaults still apply for the rest: ctrl+shift+f/b move the pane
# forward/back, ctrl+shift+r resizes interactively, ctrl+shift+w closes it.
map kitty_mod+j         next_window
map kitty_mod+k         previous_window

# File picker
map kitty_mod+e         kitten choose-files

# URLs
map kitty_mod+u         open_url_with_hints

# Sessions -- the closest kitty gets to tmux/herdr. A session file opens its
# tabs in this OS Window, and the filter below shows only the active session's
# tabs, so tab nav and goto_tab N stay inside the session. New tabs and splits
# join it because they use --cwd=current.
#
# The picker lists every *.kitty-session file in the directory and switches to
# the session, or loads it on first use. The files hold project paths, so they
# live outside the repo, next to the machine-local kitty overrides.
map kitty_mod+backslash goto_session ~/.config/hashiru/kitty/sessions
tab_bar_filter session:~

# Every kitty starts in the `home` session, so no tab is left outside one --
# the filter would hide it and nothing could switch back to it. If the file
# is missing kitty logs it and opens a plain tab, which still works: with
# everything outside a session, the filter shows it all. Restart kitty to
# apply; reloading the config does not.
startup_session ~/.config/hashiru/kitty/sessions/home.kitty-session

# New session: prompts for a name, starts it with one shell in this pane's
# cwd, and switches to it (an existing name just switches). new_session.py
# sits next to this file. Replaces the default new_os_window.
map kitty_mod+n         kitten new_session.py ~/.config/hashiru/kitty/sessions

# Save: `.` writes the session's tabs straight back to its own file, no prompt
# and no review. (Outside any session there is no file yet, so kitty prompts
# for a name instead.) --use-foreground-process records what each shell is
# running (nvim, a dev server) so it restarts too; that includes anything
# mid-run, so save from a quiet prompt.
map kitty_mod+w         save_as_session --save-only --use-foreground-process --match=session:. --base-dir ~/.config/hashiru/kitty/sessions .

tab_title_template "{session_name + ' · ' if session_name else ''}{index}: {title}{' [Z]' if layout_name == 'stack' else ''}"

# Animated cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Performance
repaint_delay       7
input_delay         0
sync_to_monitor     yes

# Ligatures and emoji
symbol_map U+1F000-U+1FAFF emoji

# Bell
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #f38ba8

# Misc
detect_urls yes
shell_integration   enabled

# Remote control over the socket only. `yes` also obeys escape codes written to
# the tty, so anything that prints — `cat` of a hostile file, curl, a remote ssh
# host — could `launch` or `send-text` on this machine. hypr/scripts/nav only
# needs the socket, and a filesystem socket (unlike an abstract `@` one) is
# gated by its mode: connecting needs write permission, which only we have.
# kitty expands the variable at startup and appends -<pid>. The runtime dir is
# 700, so no other account can squat the path first, as it could in /tmp.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/mykitty

# Machine-local overrides
#
# Read last, and kitty's parsing is last-wins, so anything here overrides the
# settings above. Lives outside the repo, so `hashiru update` never touches it:
#
#   ~/.config/hashiru/kitty/*.conf
#
# The path is relative because kitty rejects absolute glob patterns outright
# ("Non-relative patterns are unsupported"), and relative includes resolve
# against this file's *symlink* location — ~/.config/kitty — not its target in
# the Hashiru checkout. Both verified, so this reaches ~/.config/hashiru/kitty.
globinclude ../hashiru/kitty/*.conf
